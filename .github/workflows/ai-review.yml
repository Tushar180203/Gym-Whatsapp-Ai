name: AI PR review

# Automated Claude review of every pull request, using the same checklist as the
# local `review-pr` skill (.agents/skills/review-pr/SKILL.md). The AI reviewer only
# comments: it never approves or merges — a human code owner still decides (constitution XI).
# Setup: add the ANTHROPIC_API_KEY repository secret and install the Claude GitHub App
# (run `/install-github-app` in Claude Code). Without the secret the review is skipped.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-secret:
    name: Check AI reviewer configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping the AI review."
          fi

  review:
    name: Claude review
    needs: check-secret
    if: needs.check-secret.outputs.enabled == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.sha }}  HEAD: ${{ github.event.pull_request.head.sha }}

            You are the AI reviewer for this repository. The PR branch is checked out.
            1. Read AGENTS.md, .specify/memory/constitution.md and follow the checklist in
               .agents/skills/review-pr/SKILL.md exactly (traceability, AI boundaries, tests/evals,
               security/privacy, size, dependencies). CI already runs lint, tests and evals; do not re-run them.
            2. Never read .env* (except .env.example), keys, or specs/**/evaluation-runs/.
            3. Prioritise by risk: migrations and persistence, the AI boundary (packages/ai,
               packages/domain/src/conversation, packages/contracts), webhooks/auth/request validation,
               then everything else. Only report findings you verified in the code, with file:line and a
               concrete failure scenario. Missing Co-Authored-By trailers are informational only.
            4. Post inline comments with mcp__github_inline_comment__create_inline_comment (confirmed: true)
               for specific lines, then ONE summary comment with `gh pr comment` containing: a verdict line
               ("No blocking issues found" or "Blocking issues found"), findings ordered Blocking /
               Should fix / Nit, and the review-pr checklist with ✅/⚠️/❌.
            You never approve or merge.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
